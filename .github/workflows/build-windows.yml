name: Build SIIM 2026 (Windows)
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**", main ]
    paths: [ "SIIM2026/**", ".github/workflows/build-windows.yml" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: SIIM2026 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r requirements-dev.txt
      - name: Clave pública de licencias (secreto del repositorio SIIM_LICENSE_PUBKEY)
        shell: bash
        env: { PUB: "${{ secrets.SIIM_LICENSE_PUBKEY }}" }
        run: |
          if [ -n "$PUB" ]; then printf '%s\n' "$PUB" > siim/resources/license_pub.pem; echo "clave pública instalada"; else echo "SIN clave pública: build de prueba"; fi
      - name: Pruebas
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q tests
      - run: pyinstaller --noconfirm --clean siim2026.spec
      - name: Autoprueba del ejecutable empaquetado
        run: dist\SIIM2026\SIIM2026.exe --selftest
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\siim2026.iss'
      - name: Versión portable (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\SIIM2026\* -DestinationPath dist\SIIM2026_Portable.zip -Force
      - name: Capturas reales del instalador (mejor esfuerzo)
        continue-on-error: true
        shell: pwsh
        run: ./tools/ci_capturas.ps1 -Setup "$PWD\dist\SIIM2026_Setup_1.0.1.exe" -Out "$PWD\docs\img"
      - name: Guardar capturas en el repositorio
        continue-on-error: true
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add SIIM2026/docs/img/win_*.png && git commit -m "CI: capturas reales del instalador en Windows [skip ci]" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || echo "sin capturas nuevas"
      - name: Publicar en Releases (siim2026-ultima-version)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        working-directory: .
        run: |
          gh release delete siim2026-ultima-version -y --cleanup-tag || true
          gh release create siim2026-ultima-version SIIM2026/dist/SIIM2026_Setup_1.0.1.exe SIIM2026/dist/SIIM2026_Portable.zip SIIM2026/LEEME_INSTALACION.txt \
            --target "${GITHUB_SHA}" --title "SIIM 2026 – última versión" --notes "Instalador de un clic (Setup) y versión portable (zip). Compilado y autoprobado en Windows por GitHub Actions." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: SIIM2026-Setup
          path: |
            SIIM2026/dist/SIIM2026_Setup_*.exe
            SIIM2026/dist/SIIM2026_Portable.zip
