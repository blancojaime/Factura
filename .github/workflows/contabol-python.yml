name: ContaBol (Python) - pruebas e instalador

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dependencias del sistema (Qt sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest

  instalador:
    needs: pruebas
    runs-on: windows-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - name: Ejecutable (PyInstaller)
        run: pyinstaller contabol.spec --noconfirm
      - name: Autoprueba del paquete
        run: dist\ContaBol\ContaBol.exe --autoprueba
      - name: Instalador (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" scripts\instalador.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ContaBol_Setup
          path: ContaBolPy/dist/ContaBol_Setup_*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ContaBol_portable
          path: ContaBolPy/dist/ContaBol
      - name: Publicar en Releases (etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ContaBolPy/dist/ContaBol_Setup_*.exe
