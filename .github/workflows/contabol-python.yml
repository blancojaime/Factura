name: CONTA JB - pruebas e instalador

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas (Windows 10/11: Python 3.12 + PySide6)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dependencias del sistema (Qt sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest

  pruebas_win7:
    name: Pruebas (Windows 7: Python 3.8 + PySide2)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.8' }
      - name: Dependencias del sistema (Qt sin pantalla)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 poppler-utils
      - run: pip install -r requirements-win7.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest

  instalador:
    name: Instalador Windows 10/11
    needs: pruebas
    runs-on: windows-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - name: Ejecutable (PyInstaller)
        run: pyinstaller contabol.spec --noconfirm
      - name: Autoprueba del paquete
        run: dist\ContaJB\ContaJB.exe --autoprueba
      - name: Instalador (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" scripts\instalador.iss
      - name: Portable (zip)
        shell: pwsh
        run: |
          Copy-Item scripts\Restablecer_admin.bat dist\ContaJB\
          Compress-Archive -Path dist\ContaJB\* -DestinationPath dist\ContaJB_portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win10
          path: |
            ContaBolPy/dist/ContaJB_Setup.exe
            ContaBolPy/dist/ContaJB_portable.zip

  instalador_win7:
    name: Instalador Windows 7 (SP1, 64 bits)
    needs: pruebas_win7
    runs-on: windows-latest
    defaults: { run: { working-directory: ContaBolPy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x64
      - run: pip install -r requirements-win7.txt
      - name: Ejecutable (PyInstaller 5.13 + PySide2)
        run: pyinstaller contabol.spec --noconfirm
      - name: Autoprueba del paquete
        run: dist\ContaJB\ContaJB.exe --autoprueba
      - name: Instalador (Inno Setup 6.4, compatible con Windows 7)
        shell: cmd
        run: |
          choco install innosetup --version=6.4.3 -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" scripts\instalador_win7.iss
      - name: Portable (zip)
        shell: pwsh
        run: |
          Copy-Item scripts\Restablecer_admin.bat dist\ContaJB\
          Compress-Archive -Path dist\ContaJB\* -DestinationPath dist\ContaJB_portable_Win7.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win7
          path: |
            ContaBolPy/dist/ContaJB_Setup_Win7.exe
            ContaBolPy/dist/ContaJB_portable_Win7.zip

  publicar:
    name: Publicar en Releases
    needs: [ instalador, instalador_win7 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Limpiar la versión anterior (evita archivos obsoletos)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ultima-version --cleanup-tag --yes --repo ${{ github.repository }}
      - name: Publicar en Releases (siempre la última versión)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ultima-version' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'CONTA JB - última versión' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: "**Windows 10 / 11:** descargue **ContaJB_Setup.exe**, ábralo y pulse *Instalar*. **Windows 7 (SP1, 64 bits):** descargue **ContaJB_Setup_Win7.exe** (mismas funciones y apariencia). Ambos se instalan en un clic y sin permisos de administrador; también hay versiones portables (.zip). Si el usuario *admin* quedó bloqueado o olvidó la clave: ejecute **Restablecer_admin.bat** o use el botón «Restablecer administrador» de la pantalla de ingreso. Los manuales (PDF y Word) están en la misma página."
          files: |
            artefactos/ContaJB_Setup.exe
            artefactos/ContaJB_portable.zip
            artefactos/ContaJB_Setup_Win7.exe
            artefactos/ContaJB_portable_Win7.zip
            ContaBolPy/scripts/Restablecer_admin.bat
            ContaBolPy/docs/Manual_de_Activacion_ContaJB.pdf
            ContaBolPy/docs/Manual_de_Implementacion_ContaJB.pdf
            ContaBolPy/docs/Manual_de_Pruebas_ContaJB.pdf
            ContaBolPy/docs/Manual_de_Activacion_ContaJB.docx
            ContaBolPy/docs/Manual_de_Implementacion_ContaJB.docx
            ContaBolPy/docs/Manual_de_Pruebas_ContaJB.docx
