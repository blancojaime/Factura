name: Instalador COMEX JB
on:
  push:
    branches: [claude/kind-bohr-gl7xa2]
    paths: ['ComexBolPro/**', '.github/workflows/instalador-comexjb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Herramientas (NSIS, 7z, idioma español de Tesseract)
        run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full unzip curl tesseract-ocr-spa
      - name: Construir instalador (incluye OCR)
        working-directory: ComexBolPro
        run: bash installer/construir-instalador.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ComexJB-Setup
          path: ComexBolPro/dist/ComexJB-Setup-*.exe
          retention-days: 30
      - name: Publicar como Release (descarga directa del .exe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=comexjb-instalador
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" ComexBolPro/dist/ComexJB-Setup-*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "COMEX JB - instalador (con OCR)" --notes "Descargue ComexJB-Setup-*.exe y haga doble clic. Si Windows muestra SmartScreen: Más información > Ejecutar de todas formas."
