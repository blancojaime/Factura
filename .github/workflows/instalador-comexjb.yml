name: Instalador COMEX JB
on:
  push:
    branches: [claude/kind-bohr-gl7xa2]
    paths: ['ComexBolPro/**', '.github/workflows/instalador-comexjb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Herramientas (NSIS, 7z, idioma español de Tesseract)
        run: sudo apt-get update && sudo apt-get install -y nsis p7zip-full unzip curl tesseract-ocr-spa
      - name: Construir instalador (incluye OCR)
        working-directory: ComexBolPro
        run: bash installer/construir-instalador.sh
      - name: Paquete completo (instalador + manuales + plan)
        working-directory: ComexBolPro
        run: |
          V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ComexBol.App/ComexBol.App.csproj)
          P="COMEX-JB-Paquete-Completo-$V"
          mkdir -p "dist/$P/Manuales"
          cp dist/ComexJB-Setup-*.exe "dist/$P/"
          cp docs/manual/Manual-de-Usuario.* docs/manual/Manual-de-Instalacion-y-Pruebas.* docs/manual/Plan-de-Complementacion.* "dist/$P/Manuales/" 2>/dev/null || true
          printf 'COMEX JB %s\n\n1. Ejecute ComexJB-Setup-%s.exe (instalador de un clic, incluye OCR).\n2. Si Windows muestra SmartScreen: Mas informacion > Ejecutar de todas formas.\n3. Los manuales (PDF y Word) y el plan de complementacion estan en la carpeta Manuales.\n' "$V" "$V" > "dist/$P/LEEME.txt"
          (cd dist && zip -qr "$P.zip" "$P")
      - uses: actions/upload-artifact@v4
        with:
          name: ComexJB-Setup
          path: |
            ComexBolPro/dist/ComexJB-Setup-*.exe
            ComexBolPro/dist/COMEX-JB-Paquete-Completo-*.zip
          retention-days: 30
      - name: Publicar como Release (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=comexjb-instalador
          # elimina cualquier release anterior con ese tag (incluidos borradores) y el tag
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          sleep 5
          gh release create "$TAG" ComexBolPro/dist/ComexJB-Setup-*.exe ComexBolPro/dist/COMEX-JB-Paquete-Completo-*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "COMEX JB - instalador y manuales" --notes "Descargue COMEX-JB-Paquete-Completo-*.zip (instalador con OCR + manuales PDF y Word + plan de complementacion) o solo ComexJB-Setup-*.exe. Si Windows muestra SmartScreen: Mas informacion > Ejecutar de todas formas."
          # garantiza que quede publicado (no borrador)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q ".[] | select(.tag_name==\"$TAG\" or .name==\"COMEX JB - instalador y manuales\") | select(.draft==true) | .id"); do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
          done
