[project]
name = "contabol"
version = "2.0.0"
description = "ContaBol - Sistema contable integrado para Bolivia (comercial y de costos)"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.7", "reportlab>=4.0", "openpyxl>=3.1"]

[project.gui-scripts]
contabol = "contabol.ui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
