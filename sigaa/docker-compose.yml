# Servidor con PostgreSQL:  docker compose up -d   →  http://localhost:3000   (usuario admin / Admin2026, se exige cambiarla)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sigaa
      POSTGRES_PASSWORD: ${SIGAA_DB_PASSWORD:-sigaa_cambiar}
      POSTGRES_DB: sigaa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sigaa"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://sigaa:${SIGAA_DB_PASSWORD:-sigaa_cambiar}@db:5432/sigaa
      SIGAA_JWT_SECRET: ${SIGAA_JWT_SECRET:?defina SIGAA_JWT_SECRET (cadena larga aleatoria)}
      SIGAA_DEMO: ${SIGAA_DEMO:-0}
      SIGAA_ADMIN_PASSWORD: ${SIGAA_ADMIN_PASSWORD:-Admin2026}
    volumes: [fotos:/data/fotos]
    ports: ["3000:3000"]
volumes: { pgdata: {}, fotos: {} }
